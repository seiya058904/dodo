name: Dodo Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "版本标签，必须等于 v<PaperTodo.csproj 中的版本>"
        required: true
        default: "v0.1.0"
        type: string
      manual_checks_confirmed:
        description: "已完成本次提交可执行的桌面验收，并在验收记录中如实记录不可用环境限制"
        required: true
        default: false
        type: boolean
      include_no_runtime:
        description: "额外提供不内置 .NET 的完整 ZIP"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dodo-release
  cancel-in-progress: false

jobs:
  request:
    name: Validate explicit release request
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check manual acceptance and version
        id: meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANUAL_CHECKS_CONFIRMED: ${{ inputs.manual_checks_confirmed }}
        run: |
          if ($env:MANUAL_CHECKS_CONFIRMED -ne 'true') { throw 'Manual acceptance is required before release.' }
          $project = [xml](Get-Content -LiteralPath PaperTodo.csproj -Raw -Encoding UTF8)
          $versions = $project.SelectNodes('/Project/PropertyGroup/Version')
          if ($versions.Count -ne 1) { throw 'Expected exactly one project version.' }
          $expected = 'v' + $versions[0].InnerText.Trim()
          if ($env:RELEASE_TAG -cne $expected) { throw "Expected tag $expected." }
          if ($expected -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag.' }
          "tag=$expected" >> $env:GITHUB_OUTPUT

  verify:
    name: Required checks
    needs: request
    uses: ./.github/workflows/pull-request-build.yml

  release:
    name: Build complete ZIPs and publish
    needs: [request, verify]
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          # The pinned tray fork uses Git version height, including submodule history.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Rebuild LMDB and create complete licensed packages
        env:
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
          INCLUDE_NO_RUNTIME: ${{ inputs.include_no_runtime }}
        run: |
          $flavor = if ($env:INCLUDE_NO_RUNTIME -eq 'true') { 'Both' } else { 'SelfContained' }
          ./tools/Release.ps1 -RuntimeFlavor $flavor -RebuildLmdb -ExpectedTag $env:RELEASE_TAG -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'release')
      - name: Generate bilingual release notes
        env:
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
        run: |
          python -m unittest discover -s .github/scripts -p test_release_notes.py
          if ($LASTEXITCODE -ne 0) { throw 'Release-note checks failed.' }
          $assets = @(Get-ChildItem -LiteralPath release -Filter '*.zip' -File | Sort-Object Name | ForEach-Object Name) + @('SHA256SUMS.txt')
          python .github/scripts/release_notes.py --tag $env:RELEASE_TAG --repository $env:GITHUB_REPOSITORY --assets @assets --output release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release notes are incomplete.' }
      - uses: actions/upload-artifact@v7
        with:
          name: Dodo-${{ needs.request.outputs.tag }}-win-x64
          if-no-files-found: error
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = (git rev-list -n 1 "refs/tags/$tag").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:GITHUB_SHA) { throw 'Existing tag points to another commit; release tags are immutable.' }
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists. Use a new version; assets are never replaced.' }
          $assets = @(Get-ChildItem -LiteralPath release -Filter '*.zip' -File | Sort-Object Name | ForEach-Object FullName) + @((Join-Path $env:GITHUB_WORKSPACE 'release/SHA256SUMS.txt'))
          $arguments = @('release', 'create', $tag) + $assets + @('--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', "Dodo $tag", '--notes-file', 'release/RELEASE_NOTES.md')
          if ($tag.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
