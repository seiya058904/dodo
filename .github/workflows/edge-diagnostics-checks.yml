name: Edge diagnostics checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Debug diagnostics and edge checks
    concurrency:
      group: edge-diagnostics-checks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          # The pinned tray submodule calculates its version from Git history.
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Run diagnostics checks
        run: ./tools/testing/Run-Checks.ps1 -Group diagnostics
