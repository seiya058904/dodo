name: Dodo Package

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Release 正式构建 / Debug 测试构建"
        type: choice
        required: true
        default: Release
        options: [Release, Debug]
      single_file:
        description: "ZIP 内使用单文件程序（仍保留许可证与原生插件）"
        type: boolean
        default: false
      include_dotnet:
        description: "内置 .NET 运行时"
        type: boolean
        default: true
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Release
      single_file:
        type: boolean
        default: false
      include_dotnet:
        type: boolean
        default: true
      build_label:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Complete Windows ZIP
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Package selected configuration
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          SINGLE_FILE: ${{ inputs.single_file }}
          INCLUDE_DOTNET: ${{ inputs.include_dotnet }}
          BUILD_LABEL: ${{ inputs.build_label }}
        run: |
          $flavor = if ($env:INCLUDE_DOTNET -eq 'true') { 'SelfContained' } else { 'NoRuntime' }
          ./tools/Release.ps1 -Configuration $env:CONFIGURATION -RuntimeFlavor $flavor -SingleFile:($env:SINGLE_FILE -eq 'true') -BuildLabel $env:BUILD_LABEL -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'package')
      - uses: actions/upload-artifact@v7
        with:
          name: Dodo-${{ inputs.configuration }}-win-x64-${{ github.run_id }}
          if-no-files-found: error
          path: |
            package/*.zip
            package/SHA256SUMS.txt
