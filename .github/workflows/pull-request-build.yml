name: Dodo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    name: Build and regression checks
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build Dodo
        run: dotnet build ./PaperTodo.csproj -c Release
      - name: Regression checks (includes Markdown export)
        run: ./tools/testing/Run-Checks.ps1 -Group regression
      - name: Material and skin behavior checks
        # Preserve native/window/offscreen checks; do not restore unreliable DWM screenshots.
        timeout-minutes: 2
        run: ./tools/testing/Run-Checks.ps1 -Group visual -Project MicaChecks
  persistence:
    name: Persistence
    uses: ./.github/workflows/persistence-checks.yml
  plugins:
    name: Plugin contracts and samples
    uses: ./.github/workflows/plugin-samples.yml
  diagnostics:
    name: Debug and Release diagnostics
    uses: ./.github/workflows/edge-diagnostics-checks.yml
  package:
    name: Main branch package
    if: github.event_name == 'push'
    needs: [regression, persistence, plugins, diagnostics]
    uses: ./.github/workflows/debug.yml
