name: Plugin samples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-plugin-samples:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Dodo plugin host
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release

      - name: Plugin behavior and sample checks
        shell: pwsh
        run: ./tools/testing/Run-Checks.ps1 -Group plugins
