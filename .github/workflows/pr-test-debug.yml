name: Dodo PR Debug Package

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[debug]') ||
      contains(github.event.head_commit.message, '[debug-ci]')
    uses: ./.github/workflows/debug.yml
    with:
      configuration: Debug
      include_dotnet: false
      build_label: test
